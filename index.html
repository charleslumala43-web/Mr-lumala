<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Lumala – Your AI teacher for History and CRE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#F2F7FA;--ink:#14213D;--line:#CFE0EA;--green:#1E7A4C;--yellow:#FFC93C;--red:#D62F3A;--surface:#fff;--muted:#4A5B73;--onyellow:#14213D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101826;--ink:#EAF0F7;--line:#22324A;--green:#4CC38A;--red:#FF6B76;--surface:#18233A;--muted:#9FB0C7}}
:root[data-theme="dark"]{--bg:#101826;--ink:#EAF0F7;--line:#22324A;--green:#4CC38A;--red:#FF6B76;--surface:#18233A;--muted:#9FB0C7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);min-height:100vh}
main{max-width:600px;margin:0 auto;padding:28px 20px 48px;border-left:2px solid var(--red);margin-left:max(12px,calc(50% - 300px))}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;line-height:1.15}
p{margin:0 0 12px;max-width:62ch;white-space:pre-wrap}
.sub{color:var(--muted)}
.hand{font-family:Caveat,"Segoe Script",cursive;font-size:1.5rem;font-weight:600;color:var(--red);line-height:1.2}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.row{display:flex;gap:10px;margin:14px 0}
.tab{flex:1;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:10px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--green);color:#fff}
select{width:100%;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:10px;margin:4px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--surface);border:1.5px solid var(--muted);border-radius:20px;padding:6px 14px;font-size:.92rem}
.msg{margin:0 0 14px}
.msg.me{text-align:right}
.msg.me p{display:inline-block;text-align:left;background:var(--yellow);color:var(--onyellow);padding:8px 14px;border-radius:6px;margin:0}
.msg.ai{border-left:4px solid var(--green);padding-left:12px}
.msg.ai .hand{display:block}
textarea{width:100%;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:10px;resize:vertical;margin-top:8px}
.btn{background:var(--yellow);color:var(--onyellow);border:2px solid var(--ink);border-radius:6px;padding:12px 24px;font-weight:600;margin:8px 8px 0 0}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 12px 0 0}
details{margin-bottom:8px}summary{cursor:pointer;font-weight:600;padding:6px 0}.chips{margin:6px 0 10px}#chips{margin-bottom:18px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:6px}.logo{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:var(--surface)}.av{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:2px solid var(--ink)}
</style>
</head>
<body>
<main>
<div class="head"><img class="logo" id="logo" alt="Mr Lumala"><h1>Mr Lumala</h1></div>
<p class="sub">Your AI teacher for History and CRE. Ask a question, or pick a topic.</p>
<div class="row" role="group" aria-label="Subject">
<button class="tab" data-s="History" aria-pressed="true">History</button>
<button class="tab" data-s="CRE" aria-pressed="false">CRE</button>
</div>
<label class="sub" for="lv">Level</label>
<select id="lv"><option>Primary</option><option selected>O-Level (S.1–S.4)</option><option>A-Level (S.5–S.6)</option></select>
<div id="chips"></div>
<div id="log" aria-live="polite"></div>
<label class="sub" for="in">Your question</label>
<textarea id="in" rows="2" placeholder="Example: Why did the Buganda Kingdom sign the 1900 Agreement?"></textarea>
<button class="btn" id="send">Ask Mr Lumala</button>
<button class="link" id="quiz">Quiz me</button>
<button class="link" id="essay">Essay practice</button>
<button class="link" id="clr">Start over</button>
</main>

var subj="History",H=[],busy=false,fn=null;
var log=document.getElementById("log"),inp=document.getElementById("in"),send=document.getElementById("send"),lv=document.getElementById("lv");
function intro(){return "You are Mr Lumala, a kind and clear teacher for students in Uganda. Subject: "+subj+(subj==="CRE"?" (Christian Religious Education)":"")+". Level: "+lv.value+". Follow the Ugandan O-Level and A-Level syllabus (UNEB). For History, cover Ugandan, African and world history and link them (for example, how the Berlin Conference led to the 1900 Agreement). For CRE, cover the Old Testament, the life of Jesus, the early church, Christianity in Uganda and Africa, and Christian living. For Primary and O-Level give key facts, causes and effects. For A-Level go deeper with analysis, comparison and essay structure. Use simple words and short paragraphs. Write plain text only, with no markdown symbols, and keep answers under 200 words unless asked for more. For CRE, give Bible references and respect Christian teaching. If the student asks for a quiz, ask one question at a time and wait for the answer. End explanations with one short question to check understanding. If the question is off subject, gently bring the student back to "+subj+"."}
function add(role,text){var d=document.createElement("div");d.className="msg "+role;
if(role==="ai"){var n=document.createElement("span");n.className="hand";var a=document.createElement("img");a.className="av";a.src=LOGO;a.alt="";n.textContent="Mr Lumala";n.prepend(a);d.appendChild(n)}
var p=document.createElement("p");p.textContent=text;d.appendChild(p);log.appendChild(d);d.scrollIntoView({block:"nearest"});return p}
function reset(){H=[];log.textContent="";add("ai","Hello! I’m Mr Lumala. Ask me anything about "+subj+", or tap a topic above.");
var c=document.getElementById("chips");c.textContent="";
Object.keys(TOP[subj]).forEach(function(g){var d=document.createElement("details"),s=document.createElement("summary"),w=document.createElement("div");s.textContent=g;w.className="chips";
TOP[subj][g].forEach(function(t){var b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=function(){ask("Explain: "+t+" ("+g+")")};w.appendChild(b)});d.appendChild(s);d.appendChild(w);c.appendChild(d)})}
async function ask(text){
text=(text||"").trim();if(!text||busy)return;
busy=true;send.disabled=true;inp.value="";add("me",text);var p=add("ai","Thinking…");
var m={role:"user",content:(H.length?"":intro()+"\n\nStudent: ")+text};
try{
if(!fn){fn=window.claude&&window.claude.use?await window.claude.use("sample"):null}
if(!fn){p.textContent="The AI teacher is not available here. Open this page in the Claude app to use it.";return}
var r=await fn(H.concat([m]),{cache:false,onText:function(o){p.textContent=o.text}});
p.textContent=r.text;H.push(m,{role:"assistant",content:r.text});
}catch(e){
p.textContent=e&&e.code==="rate_limited"?"Too many questions at once. Wait a moment, then ask again.":
e&&e.code==="not_granted"?"Permission was not given, so Mr Lumala can’t answer. Tap Ask again and allow it.":
"Something went wrong. Check your connection and try again."}
finally{busy=false;send.disabled=false}}
send.onclick=function(){ask(inp.value)};
document.getElementById("quiz").onclick=function(){ask("Quiz me on "+subj+". Ask one question at a time.")};
document.getElementById("essay").onclick=function(){ask("Give me one UNEB-style essay question on "+subj+" for my level. Then mark my answer when I reply.")};
document.getElementById("clr").onclick=reset;
lv.onchange=reset;
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){subj=b.dataset.s;
document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});reset()}});
document.getElementById("logo").src=LOGO;
reset();
</script>
